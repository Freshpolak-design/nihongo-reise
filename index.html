<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nihongo Reise</title>
  <meta name="description" content="Japanisch-Basics für die Japanreise trainieren – mit Audio, Quiz und Dialogen.">
  <meta name="theme-color" content="#FF6B6B">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">🎌 <span>Nihongo Reise</span></div>
    <div class="chips">
      <span class="chip" id="chip-streak" title="Tage in Folge">🔥 0</span>
      <span class="chip" id="chip-xp" title="Punkte">⭐ 0</span>
      <button class="icon-btn" id="btn-settings" aria-label="Einstellungen">⚙️</button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="home"><span>🏠</span>Start</button>
    <button data-tab="cards"><span>🃏</span>Karten</button>
    <button data-tab="quiz"><span>🎯</span>Quiz</button>
    <button data-tab="dialogs"><span>💬</span>Dialoge</button>
    <button data-tab="travel"><span>🧳</span>Reise</button>
  </nav>

  <div class="sheet-backdrop" id="sheet" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
